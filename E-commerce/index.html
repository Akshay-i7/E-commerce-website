<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="poster.css">
    <link rel="stylesheet" href="options.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <style>

    </style>
    <div class="main">
        <div class="sidebar1">

    </div>


    <div class="navbar">
        <div class="left-section">
            <p class="logo">LOGO</p>
        </div>

        <div class="middle-section">
            <input class="search-bar" type="text" placeholder="Search" >
            <button class="search-button">Search</button>
        </div>

        <div class="right-section">
            <p class="signup"><img class="user-icon" src="icon/user.svg">Login/Signup</p>
            <p class="wishlist"><img class="heart-icon" src="icon/heart.svg"></p>
            <p class="cart"><img class="cart-icon" src="icon/cart.svg">Cart</p>
        </div>
    </div>

    <div class="list">
        <p>Home</p>
        <p>Shop</p>
        <p>Men</p>
        <p>Wome</p>
        <p>Electronics</p>
        <p>Home & Living</p>
        <p>Beauty</p>
        <p>Sports</p>
        <p>Sale</p>
    </div>

    <!-- Poster -->

    <div class="poster">
        <img class="poster-picture" src="options/poster.png">
    </div>
    
    <!-- Featured Categories -->

    <div>
        <p class="feature">Featured categories</p>
        <div class="options">
            <div>
                <img class="image" src="featured/fashion.jpg">
                <p class="text">Fashion</p>
            </div>
    
            <div>
                <img class="image" src="featured/iphone.jpg">
                <p>Mobiles</p>
            </div>
            <div>
                <img class="image" src="featured/laptop.jpg">
                <p>Laptops</p>
            </div>
            <div>
                <img class="image" src="featured/shoes.jpg">
                <p>Shoes</p>

            </div>
            <div>
                <img class="image" src="featured/watches.jpg">
                <p>Watches</p>
            </div>
            <div>
                <img class="image" src="featured/furniture.jpg">
                <p>Furniture</p>
            </div>
        </div>
    </div>

    <!-- Product grid here -->
    
    <div>
        <div>
            <p>Best Sellers</p>
        </div>
            <div class="product-grid">
                <div class="product-image">
                    <p>Product Image</p>
                </div>
                <div class="product-details">
                    <p>Product Name</p>
                    <p>Price</p>
                </div>
                <div class="add-to-cart">
                    <button>Add to Cart</button>
                </div>
            </div>
    </div>

    <div>
        <p>Flash sale</p>
        <p>Limited time offer hurry up</p>
    </div>
    
</body>
</html>
